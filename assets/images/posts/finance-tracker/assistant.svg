<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1090" viewBox="0 0 1080 1090" role="img" aria-labelledby="title description">
<title id="title">FinanceTracker · optional transaction assistant</title><desc id="description">An explicit user request calls the authenticated FastAPI assistant endpoint and enters a separate Redis RQ queue. The assistant worker runs a bounded model loop with validated SELECT queries and per-user PostgreSQL roles and forced row-level security. An UPDATE is executed for a before-and-after preview and rolled back. The preview is stored in PostgreSQL; the user separately applies or discards it. Apply checks for stale values and records audit history; applied changes can be rolled back.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526773"/></marker>
<marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7855a3"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183341}.label{font-size:17px;fill:#526773;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}.small{font-size:17px;fill:#526773}.heading{font-size:22px;font-weight:700}.body{font-size:18px}.section{font-size:20px;font-weight:700;letter-spacing:1px;fill:#526773}</style>
<rect width="1080" height="1090" rx="16" fill="white"/>
<text x="35" y="42" class="heading" text-anchor="start">FinanceTracker · optional transaction assistant</text>
<text x="35" y="69" class="small" text-anchor="start">Starts only when a user asks for a custom ledger change · independent of file ingestion</text>
<rect x="50" y="110" width="280" height="95" rx="10" fill="#edf5fa" stroke="#9aafb9" stroke-width="1.5"/>
<text x="66" y="139" class="heading" text-anchor="start">User request</text>
<text x="66" y="167" class="body" text-anchor="start">Describe a cleanup task</text>
<text x="66" y="190" class="body" text-anchor="start">In the transaction interface</text>
<rect x="400" y="110" width="280" height="95" rx="10" fill="#edf5fa" stroke="#9aafb9" stroke-width="1.5"/>
<text x="416" y="139" class="heading" text-anchor="start">FastAPI</text>
<text x="416" y="167" class="body" text-anchor="start">Authenticate + create run</text>
<text x="416" y="190" class="body" text-anchor="start">User-triggered run endpoint</text>
<rect x="750" y="110" width="280" height="95" rx="10" fill="#edf7f3" stroke="#9aafb9" stroke-width="1.5"/>
<text x="766" y="139" class="heading" text-anchor="start">Redis / RQ</text>
<text x="766" y="167" class="body" text-anchor="start">Separate assistant queue</text>
<text x="766" y="190" class="body" text-anchor="start">run ID + user ID</text>
<path d="M330 157 H400" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 157 H750" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="275" width="1040" height="375" rx="14" fill="#fafcfc" stroke="#d5e0e5" stroke-width="1.5"/>
<text x="410" y="305" class="section" text-anchor="start">ASSISTANT WORKER · SQL TOOL LOOP</text>
<path d="M890 205 V244 H220 V330" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="330" width="280" height="125" rx="10" fill="#f3effa" stroke="#9aafb9" stroke-width="1.5"/>
<text x="96" y="359" class="heading" text-anchor="start">Model chooses a step</text>
<text x="96" y="387" class="body" text-anchor="start">Shared Qwen3.5-9B service</text>
<text x="96" y="410" class="body" text-anchor="start">SELECT → inspect → repeat</text>
<text x="96" y="433" class="body" text-anchor="start">Then UPDATE preview / FINAL</text>
<rect x="410" y="330" width="270" height="125" rx="10" fill="#edf5fa" stroke="#9aafb9" stroke-width="1.5"/>
<text x="426" y="359" class="heading" text-anchor="start">Validate SQL</text>
<text x="426" y="387" class="body" text-anchor="start">Restricted statements / fields</text>
<text x="426" y="410" class="body" text-anchor="start">Category · type · note</text>
<text x="426" y="433" class="body" text-anchor="start">Visibility only for edits</text>
<rect x="750" y="330" width="280" height="125" rx="10" fill="#edf7f3" stroke="#9aafb9" stroke-width="1.5"/>
<text x="766" y="359" class="heading" text-anchor="start">PostgreSQL executor</text>
<text x="766" y="387" class="body" text-anchor="start">Per-user roles + forced RLS</text>
<text x="766" y="410" class="body" text-anchor="start">Read own ledger rows</text>
<text x="766" y="433" class="body" text-anchor="start">UPDATE → diff → rollback</text>
<path d="M360 388 H410" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M680 388 H750" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M790 455 V503 H220 V455" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510" y="490" class="label" text-anchor="middle">SELECT results inform the next step · at most 8 queries</text>
<rect x="410" y="552" width="270" height="72" rx="10" fill="#edf5fa" stroke="#9aafb9" stroke-width="1.5"/>
<text x="426" y="581" class="heading" text-anchor="start">Change preview</text>
<text x="426" y="609" class="body" text-anchor="start">Before / after row values</text>
<path d="M890 455 V588 H680" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="901" y="554" class="label" text-anchor="start">UPDATE</text>
<rect x="400" y="700" width="280" height="78" rx="10" fill="#edf7f3" stroke="#9aafb9" stroke-width="1.5"/>
<text x="416" y="729" class="heading" text-anchor="start">Store preview</text>
<text x="416" y="757" class="body" text-anchor="start">PostgreSQL assistant run</text>
<path d="M545 624 V700" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="568" y="682" class="label" text-anchor="start">No ledger edits committed</text>
<rect x="400" y="825" width="280" height="95" rx="10" fill="#edf5fa" stroke="#9aafb9" stroke-width="1.5"/>
<text x="416" y="854" class="heading" text-anchor="start">User reviews rows</text>
<text x="416" y="882" class="body" text-anchor="start">Apply or discard</text>
<text x="416" y="905" class="body" text-anchor="start">A separate explicit action</text>
<path d="M540 778 V825" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="825" width="280" height="95" rx="10" fill="#edf5fa" stroke="#9aafb9" stroke-width="1.5"/>
<text x="766" y="854" class="heading" text-anchor="start">FastAPI apply</text>
<text x="766" y="882" class="body" text-anchor="start">Check preview is still current</text>
<text x="766" y="905" class="body" text-anchor="start">Apply changes + audit</text>
<path d="M680 873 H750" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="715" y="853" class="label" text-anchor="middle">apply</text>
<rect x="50" y="973" width="280" height="78" rx="10" fill="#edf5fa" stroke="#9aafb9" stroke-width="1.5"/>
<text x="66" y="1002" class="heading" text-anchor="start">Discard</text>
<text x="66" y="1030" class="body" text-anchor="start">Leave ledger unchanged</text>
<path d="M400 873 H362 V1012 H330" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="973" width="280" height="78" rx="10" fill="#edf7f3" stroke="#9aafb9" stroke-width="1.5"/>
<text x="766" y="1002" class="heading" text-anchor="start">PostgreSQL ledger</text>
<text x="766" y="1030" class="body" text-anchor="start">Audit supports later rollback</text>
<path d="M890 920 V973" fill="none" stroke="#526773" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="1080" class="small" text-anchor="start">Normal uploads and dashboard queries never require an assistant run.</text>
</svg>
