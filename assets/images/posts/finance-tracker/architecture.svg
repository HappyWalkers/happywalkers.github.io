<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
<title id="title">FinanceTracker · services and ingestion</title><desc id="description">The Next.js frontend calls authenticated FastAPI routes. PostgreSQL stores accounts, sessions, transactions, import provenance, and audit records. MinIO stores uploads; Redis RQ queues one job per batch. The ingestion worker parses each CSV, Excel, or PDF, maps and normalizes each file, combines the batch, merges duplicates, converts amounts to USD, hides offsets, categorizes, and reconciles the existing ledger. Model-assisted steps share a local Qwen3.5-9B service. PDF extraction calls hosted PaddleOCR by default or an optional local OCR service. The transaction assistant is separate and user-triggered.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526773"/></marker>
<marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7855a3"/></marker></defs>
