<text x="370" y="150" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#5e5e5a" text-anchor="end" xml:space="preserve" style="white-space:pre">front</text>
<text x="182" y="150" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">tail</text>
<text x="390" y="150" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">front</text>
<text x="578" y="150" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#5e5e5a" text-anchor="end" xml:space="preserve" style="white-space:pre">tail</text>
<path d="M176,184 v8 h408 v-8" fill="none" stroke="#5e5e5a" stroke-width="1"/>
<text x="380" y="208" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5e5e5a" text-anchor="middle" xml:space="preserve" style="white-space:pre">resident: at most one entry per frame (the replacer&#x27;s capacity)</text>
<path d="M20,220 v8 h720 v-8" fill="none" stroke="#5e5e5a" stroke-width="1"/>
<text x="380" y="244" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5e5e5a" text-anchor="middle" xml:space="preserve" style="white-space:pre">all four lists together: at most 2 × capacity</text>
<path d="M200,84 C188,62 170,62 158,80" fill="none" stroke="#c0504d" stroke-width="1.3" marker-end="url(#ahr)"/>
<text x="178" y="60" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="400" fill="#c0504d" text-anchor="middle" xml:space="preserve" style="white-space:pre">evict</text>
<text x="380" y="172" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#c0504d" text-anchor="middle" xml:space="preserve" style="white-space:pre">mru_target_size_ = 2, |MRU| = 3  →  Evict() takes the MRU tail (p8 → MRU ghost)</text>
<rect x="20" y="266" width="352" height="212" rx="6" fill="#fff" stroke="#9a9a94" stroke-width="1.3"/>
<text x="34" y="290" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">RecordAccess(frame, page)</text>
<circle cx="44" cy="314" r="9" fill="#3d4a5c"/>
<text x="44" y="318" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve" style="white-space:pre">1</text>
<text x="60" y="318" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">in MRU or MFU (a real hit):</text>
<text x="60" y="334" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">move to the front of MFU</text>
<circle cx="44" cy="346" r="9" fill="#3d4a5c"/>
<text x="44" y="350" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve" style="white-space:pre">2</text>
<text x="60" y="350" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">in MRU ghost:</text>
<text x="60" y="366" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">raise the target, move to MFU front</text>
<circle cx="44" cy="378" r="9" fill="#3d4a5c"/>
<text x="44" y="382" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve" style="white-space:pre">3</text>
<text x="60" y="382" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">in MFU ghost:</text>
<text x="60" y="398" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">lower the target, move to MFU front</text>
<circle cx="44" cy="410" r="9" fill="#3d4a5c"/>
<text x="44" y="414" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve" style="white-space:pre">4</text>
<text x="60" y="414" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">nowhere:</text>
<text x="60" y="430" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">add to the front of MRU, first</text>
<text x="60" y="447" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">dropping a ghost if the lists are full</text>
<rect x="388" y="266" width="352" height="212" rx="6" fill="#fff" stroke="#9a9a94" stroke-width="1.3"/>
<text x="402" y="290" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">Evict()</text>
<text x="402" y="318" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">|MRU| ≥ target → take from the MRU tail,</text>
<text x="402" y="337" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">otherwise from the MFU tail</text>
<text x="402" y="375" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">pinned frames are skipped; if one side</text>
<text x="402" y="394" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">has nothing evictable, try the other</text>
<text x="402" y="432" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">the evicted page id moves to the</text>
<text x="402" y="451" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">front of that side&#x27;s ghost list</text>
<text x="402" y="466" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" fill="#c0504d" text-anchor="start" xml:space="preserve" style="white-space:pre">A ghost hit means: a bigger list would have hit.</text>
</svg>
