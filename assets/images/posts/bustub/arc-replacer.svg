<text x="665.0" y="40" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1d1d1d" text-anchor="middle" xml:space="preserve" style="white-space:pre">MFU ghost</text>
<text x="665.0" y="58" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5e5e5a" text-anchor="middle" xml:space="preserve" style="white-space:pre">page ids only</text>
