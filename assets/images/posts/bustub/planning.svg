<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="From SQL to a plan in BusTub: parser and binder, planner, starter optimizer rules and the NLJ-as-hash-join rewrite, with the plan tree after each step">
<title>From SQL to a plan in BusTub: parser and binder, planner, starter optimizer rules and the NLJ-as-hash-join rewrite, with the plan tree after each step</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4a46"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f8f5a"/></marker>
<marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a74"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#dcdcd6" stroke-width="3"/></pattern>
</defs>
<rect x="0" y="0" width="760" height="640" fill="#ffffff"/>
<rect x="20" y="12" width="720" height="52" rx="6" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1.3"/>
<text x="34" y="34" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">SELECT * FROM t1, t2 WHERE t1.a = t2.a AND t1.b = t2.c;</text>
<text x="34" y="54" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">t1(a INT, b INT), t2(a INT, c INT)</text>
<line x1="145" y1="64" x2="145" y2="83" stroke="#4a4a46" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="20" y="84" width="250" height="92" rx="6" fill="#e8eefb" stroke="#7d9bd1" stroke-width="1.3"/>
<text x="30" y="104" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">Parser + binder</text>
<text x="30" y="121" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">libpg_query parses the text;</text>
<text x="30" y="137" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">the binder resolves t1, t2 and</text>
<text x="30" y="153" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">each column via the catalog</text>
<rect x="290" y="84" width="450" height="92" rx="6" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1.3"/>
<text x="302" y="106" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">BoundSelect {</text>
<text x="302" y="123" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  table=BoundCrossProductRef { t1, t2 },</text>
<text x="302" y="140" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  columns=[t1.a, t1.b, t2.a, t2.c],</text>
<text x="302" y="157" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  where=((t1.a=t2.a)and(t1.b=t2.c)) }</text>
<line x1="271" y1="130.0" x2="289" y2="130.0" stroke="#c9c9c3" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="145" y1="176" x2="145" y2="195" stroke="#4a4a46" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="20" y="196" width="250" height="112" rx="6" fill="#e8eefb" stroke="#7d9bd1" stroke-width="1.3"/>
<text x="30" y="216" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">Planner</text>
<text x="30" y="233" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">one node per operator;</text>
<text x="30" y="249" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">each node carries its</text>
<text x="30" y="265" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">output schema</text>
<rect x="290" y="196" width="450" height="112" rx="6" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1.3"/>
<text x="302" y="218" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">Projection { exprs=[#0.0, #0.1, #0.2, #0.3] }</text>
<text x="302" y="235" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  Filter { ((#0.0=#0.2)and(#0.1=#0.3)) }</text>
<text x="302" y="252" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">    NestedLoopJoin { predicate=true }</text>
<text x="302" y="269" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">      SeqScan { table=t1 }</text>
<text x="302" y="286" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">      SeqScan { table=t2 }</text>
<line x1="271" y1="252.0" x2="289" y2="252.0" stroke="#c9c9c3" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="145" y1="308" x2="145" y2="327" stroke="#4a4a46" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="20" y="328" width="250" height="112" rx="6" fill="#e8eefb" stroke="#7d9bd1" stroke-width="1.3"/>
<text x="30" y="348" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">Starter rules</text>
<text x="30" y="365" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">MergeProjection, MergeFilterNLJ,</text>
<text x="30" y="381" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">NLJAsIndexJoin, OrderByAsIndexScan,</text>
<text x="30" y="397" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">MergeFilterScan, SeqScanAsIndexScan</text>
<rect x="290" y="328" width="450" height="112" rx="6" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1.3"/>
<text x="302" y="350" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">NestedLoopJoin { type=Inner,</text>
<text x="302" y="367" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  predicate=((#0.0=#1.0)and(#0.1=#1.1)) }</text>
<text x="302" y="384" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  SeqScan { table=t1 }</text>
<text x="302" y="401" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  SeqScan { table=t2 }</text>
<text x="728" y="428" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5e5e5a" text-anchor="end" xml:space="preserve" style="white-space:pre">projection dropped, filter merged into the join</text>
<line x1="271" y1="384.0" x2="289" y2="384.0" stroke="#c9c9c3" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="145" y1="440" x2="145" y2="459" stroke="#4a4a46" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="20" y="460" width="250" height="100" rx="6" fill="#e8eefb" stroke="#7d9bd1" stroke-width="1.3"/>
<text x="30" y="480" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">NLJAsHashJoin</text>
<text x="30" y="497" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">equality conditions joined by</text>
<text x="30" y="513" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">AND become one key list</text>
<text x="30" y="529" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">per side</text>
<rect x="239.2" y="466" width="25" height="18" rx="9" fill="#3d4a5c"/>
<text x="251.6" y="479" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve" style="white-space:pre">P3</text>
<rect x="290" y="460" width="450" height="100" rx="6" fill="#f7f7f5" stroke="#c9c9c3" stroke-width="1.3"/>
<text x="302" y="482" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">HashJoin { type=Inner,</text>
<text x="302" y="499" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  left_key=[#0.0, #0.1],</text>
<text x="302" y="516" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  right_key=[#0.0, #0.1] }</text>
<text x="302" y="533" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  SeqScan { table=t1 }</text>
<text x="302" y="550" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">  SeqScan { table=t2 }</text>
<line x1="271" y1="510.0" x2="289" y2="510.0" stroke="#c9c9c3" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="145" y1="560" x2="145" y2="579" stroke="#4a4a46" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="20" y="580" width="250" height="50" rx="6" fill="#e7f3ea" stroke="#78ad87" stroke-width="1.3"/>
<text x="30" y="600" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1d1d1d" text-anchor="start" xml:space="preserve" style="white-space:pre">ExecutorFactory</text>
<text x="30" y="617" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">one executor per plan node (Fig. 8)</text>
<text x="290" y="596" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">#i.j = column j of input i. A join predicate sees two inputs (#0 left, #1 right);</text>
<text x="290" y="612" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">each hash-key list is evaluated on its own side, so both start at #0.</text>
<text x="290" y="628" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" fill="#5e5e5a" text-anchor="start" xml:space="preserve" style="white-space:pre">Output schemas omitted.</text>
</svg>
